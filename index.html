<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="description" content="林柏希的個人介紹頁，分享我的背景、興趣與專業技能。">
  <title>林柏希｜個人介紹</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f8f5;
      --surface: #ffffff;
      --surface-soft: #f1f3ed;
      --text: #202a27;
      --muted: #68736d;
      --accent: #527b68;
      --accent-dark: #365b49;
      --accent-light: #e4eee7;
      --line: #e7eae4;
      --shadow: 0 20px 60px rgba(37, 57, 46, 0.08);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 10% 5%, rgba(218, 234, 221, 0.65), transparent 34rem),
        var(--background);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 0;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .topbar a {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    .topbar a:hover {
      color: var(--accent-dark);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 48px;
      min-height: 510px;
      padding: 40px 0 74px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 20px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .eyebrow::before {
      width: 24px;
      height: 1px;
      background: var(--accent);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.15;
      letter-spacing: 0.03em;
    }

    .hero-copy {
      max-width: 560px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .hero-copy strong {
      color: var(--text);
      font-weight: 600;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: var(--accent-dark);
    }

    .button.secondary {
      border-color: var(--line);
      background: var(--surface);
      color: var(--text);
    }

    .button.secondary:hover {
      border-color: #cbd9ce;
      background: var(--accent-light);
    }

    .photo-card {
      position: relative;
      display: grid;
      min-height: 350px;
      place-items: center;
      overflow: hidden;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      background: linear-gradient(145deg, #eaf1e9, #f8f5ec);
      box-shadow: var(--shadow);
    }

    .photo-card::before,
    .photo-card::after {
      position: absolute;
      border: 1px solid rgba(82, 123, 104, 0.12);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .photo-card::before {
      width: 280px;
      height: 280px;
    }

    .photo-card::after {
      width: 350px;
      height: 350px;
    }

    .photo-upload {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(250px, 100%);
      aspect-ratio: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px dashed rgba(82, 123, 104, 0.48);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      color: var(--accent-dark);
      text-align: center;
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .photo-upload:hover,
    .photo-upload:focus-within {
      transform: scale(1.02);
      border-color: var(--accent-dark);
    }

    .photo-upload input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .photo-upload:focus-within {
      outline: 3px solid rgba(82, 123, 104, 0.35);
      outline-offset: 5px;
    }

    .photo-icon {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      margin-bottom: 12px;
      border-radius: 50%;
      background: var(--accent-light);
      font-size: 25px;
    }

    .photo-title {
      font-size: 15px;
      font-weight: 800;
    }

    .photo-hint {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    /* 有照片時的懸浮遮罩與文字效果 */
    .photo-upload.has-photo .photo-title,
    .photo-upload.has-photo .photo-hint {
      position: relative;
      z-index: 2;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .photo-upload.has-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(32, 42, 39, 0.45);
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .photo-upload.has-photo:hover .photo-title,
    .photo-upload.has-photo:hover .photo-hint,
    .photo-upload.has-photo:hover::after,
    .photo-upload.has-photo:focus-within .photo-title,
    .photo-upload.has-photo:focus-within .photo-hint,
    .photo-upload.has-photo:focus-within::after {
      opacity: 1;
    }

    #photoPreview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #photoPreview[hidden] {
      display: none;
    }

    .section {
      padding: 42px 0;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: clamp(24px, 4vw, 32px);
      letter-spacing: 0.03em;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .about-card,
    .info-card,
    .contact-card {
      border: 1px solid rgba(231, 234, 228, 0.9);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 10px 35px rgba(37, 57, 46, 0.04);
    }

    .about-card {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 28px;
    }

    .quote-mark {
      flex: 0 0 auto;
      color: #a4c0aa;
      font-family: Georgia, serif;
      font-size: 62px;
      line-height: 1;
    }

    .about-card p {
      margin: 0;
      font-size: clamp(17px, 3vw, 22px);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .info-card {
      min-height: 190px;
      padding: 24px;
    }

    .card-label {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .info-card h3 {
      margin: 0 0 9px;
      font-size: 19px;
      line-height: 1.5;
    }

    .info-card p:last-child {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .tag {
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-light);
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .contact-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 24px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 16px;
      border-radius: 16px;
      background: var(--surface-soft);
      text-decoration: none;
    }

    .contact-item:hover {
      background: var(--accent-light);
    }

    .contact-icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 13px;
      background: var(--surface);
      font-size: 19px;
    }

    .contact-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .contact-value {
      display: block;
      overflow-wrap: anywhere;
      font-size: 14px;
      font-weight: 700;
    }

    footer {
      padding: 38px 0 28px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 34px;
        min-height: auto;
        padding: 48px 0 42px;
      }

      .photo-card {
        min-height: 320px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .info-card {
        min-height: auto;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 28px, 1080px);
      }

      .topbar {
        padding: 20px 0;
      }

      .section {
        padding: 30px 0;
      }

      .section-heading {
        align-items: start;
        flex-direction: column;
        gap: 5px;
      }

      .about-card {
        align-items: start;
        gap: 10px;
        padding: 22px;
      }

      .quote-mark {
        font-size: 42px;
      }

      .contact-card {
        grid-template-columns: 1fr;
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar" aria-label="主要導覽">
      <span class="brand">林柏希・個人頁</span>
      <a href="#contact">聯絡我 <span aria-hidden="true">↗</span></a>
    </nav>

    <header class="hero">
      <div>
        <p class="eyebrow">ABOUT ME</p>
        <h1>你好，我是<br>林柏希。</h1>
        <p class="hero-copy">
          就讀黎明技術學院數位多媒體系。<br>
          <strong>喜歡簡單生活，也喜歡認真對待每一件事。</strong>
        </p>
        <div class="hero-actions">
          <a class="button" href="#about">認識我 <span aria-hidden="true">↓</span></a>
          <a class="button secondary" href="#contact">聯絡方式</a>
        </div>
      </div>

      <div class="photo-card">
        <label class="photo-upload has-photo" for="photoInput">
          <input id="photoInput" type="file" accept="image/*" aria-label="選擇個人照片">
          <img id="photoPreview" alt="個人照片預覽" src="1000036327.jpg">
          <span class="photo-icon" aria-hidden="true" hidden>＋</span>
          <span class="photo-title">更換照片</span>
          <span class="photo-hint">點擊此處重新選擇</span>
        </label>
      </div>
    </header>

    <section class="section" id="about">
      <div class="section-heading">
        <h2>關於我</h2>
        <p>用好奇心探索，用認真把事情做好。</p>
      </div>
      <div class="about-card">
        <span class="quote-mark" aria-hidden="true">“</span>
        <p>喜歡簡單生活，也喜歡認真對待每一件事。</p>
      </div>
    </section>

    <section class="section" aria-label="我的背景與興趣">
      <div class="cards">
        <article class="info-card">
          <p class="card-label">EDUCATION</p>
          <h3>黎明技術學院</h3>
          <p>數位多媒體系</p>
        </article>

        <article class="info-card">
          <p class="card-label">INTERESTS</p>
          <h3>我的興趣</h3>
          <div class="tags">
            <span class="tag">讀書</span>
            <span class="tag">睡覺</span>
          </div>
        </article>

        <article class="info-card">
          <p class="card-label">SKILLS</p>
          <h3>我的技能</h3>
          <div class="tags">
            <span class="tag">寫代碼</span>
            <span class="tag">微積分</span>
          </div>
        </article>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="section-heading">
        <h2>聯繫方式</h2>
        <p>歡迎與我聯繫。</p>
      </div>
      <div class="contact-card">
        <a class="contact-item" href="mailto:bd1151035@gmail.lit.edu.tw">
          <span class="contact-icon" aria-hidden="true">✉</span>
          <span>
            <span class="contact-label">Email</span>
            <span class="contact-value">bd1151035@gmail.lit.edu.tw</span>
          </span>
        </a>
        <div class="contact-item">
          <span class="contact-icon" aria-hidden="true">☏</span>
          <span>
            <span class="contact-label">Line ID</span>
            <span class="contact-value">5487707752</span>
          </span>
        </div>
      </div>
    </section>

    <footer>© <span id="year"></span> 林柏希・個人介紹</footer>
  </main>

  <script>
    const photoInput = document.getElementById("photoInput");
    const photoPreview = document.getElementById("photoPreview");
    const photoLabel = document.querySelector(".photo-upload");
    let currentPhotoUrl = null;

    photoInput.addEventListener("change", () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("請選擇圖片檔案。");
        photoInput.value = "";
        return;
      }

      if (currentPhotoUrl) URL.revokeObjectURL(currentPhotoUrl);
      currentPhotoUrl = URL.createObjectURL(file);
      photoPreview.src = currentPhotoUrl;
      photoPreview.hidden = false;
      photoLabel.classList.add("has-photo");
      photoLabel.querySelector(".photo-icon").hidden = true;
      photoLabel.querySelector(".photo-title").textContent = "更換照片";
      photoLabel.querySelector(".photo-hint").textContent = "點擊此處重新選擇";
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
